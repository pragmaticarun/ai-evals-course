# Built with Zensical (`uv run zensical build`), which reads this file directly.
# Kept compatible with Material for MkDocs so `uv run mkdocs build` works as a fallback.
# No `hooks:` (unsupported by Zensical) and only pymdownx/markdown extensions.
site_name: AI Evals, Hands-On
site_description: An original, hands-on course on evaluating LLM agents, built around one running agent.
site_author: Arunkumar Maniam Rajan
site_url: https://pragmaticarun.github.io/ai-evals-course/
repo_url: https://github.com/pragmaticarun/ai-evals-course
repo_name: pragmaticarun/ai-evals-course
edit_uri: edit/main/docs/
copyright: Content CC BY 4.0, code MIT. Copyright 2026 Arunkumar Maniam Rajan.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

