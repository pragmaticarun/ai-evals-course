[project]
name = "evalkit"
version = "0.1.0"
description = "Small, dependency-light eval toolkit used throughout the course: LLM record/replay, checks, reports."
requires-python = ">=3.14,<3.16"
license = "MIT"
dependencies = [
    "anthropic==2.12.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]
