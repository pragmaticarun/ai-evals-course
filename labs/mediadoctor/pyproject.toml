[project]
name = "mediadoctor"
version = "0.9.0"
description = "MediaDoctor: the course's running agent for Android and multimedia debugging questions."
requires-python = ">=3.14,<3.16"
license = "MIT"
dependencies = [
    "evalkit",
]

[project.scripts]
mediadoctor-lab01 = "mediadoctor.lab01:main"
mediadoctor-lab02 = "mediadoctor.lab02:main"
mediadoctor-lab03 = "mediadoctor.lab03:main"
mediadoctor-lab04 = "mediadoctor.lab04:main"
mediadoctor-lab05 = "mediadoctor.lab05:main"
mediadoctor-lab06 = "mediadoctor.lab06:main"
mediadoctor-lab07 = "mediadoctor.lab07:main"
mediadoctor-lab08 = "mediadoctor.lab08:main"
mediadoctor-lab09 = "mediadoctor.lab09:main"

[tool.uv.sources]
evalkit = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediadoctor"]
