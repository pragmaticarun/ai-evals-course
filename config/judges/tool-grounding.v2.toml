# Judge for the failure mode "ignored-tool-output". Version 2.
# Change from v1 (written when the course's original planted traces showed it): v1 passed answers that repeated a wrong claim the
# USER had made, as if agreeing with the user made it true. v2 says so in the FAIL definition and adds
# two few-shot examples of exactly that kind: the user asserts a claim the tool output contradicts and
# the answer sides with the tools (PASS). No train trace repeats such a claim, so there is no negative.
# Few-shot examples are module 5 traces from the TRAIN split only (`mediadoctor-lab05 leaks` checks).
name = "tool-grounding"
version = "v2"
mode = "ignored-tool-output"
context = ["question", "tools", "answer"]
criterion = "The answer's claims about files, devices, and logs agree with what the tool calls returned."
pass = """
Every statement in the answer about a file, device, decoder, or log is supported by, or at least not
contradicted by, the tool results. Answers that make no such claim, or that ask for more information,
pass. Judge only agreement with the tool results; do not judge style, the next step, or citations."""
fail = """
The answer states something about a file, device, decoder, or log that a tool result contradicts:
a different number (resolution, frame rate, decoder count, start time), a capability the tool says is
absent, or a cause the log rules out. This applies even when the user asserted the same claim in the
question: agreeing with the user does not make a claim true if the tool output contradicts it."""

[[example]]
case_id = "m4q007"
verdict = "PASS"
critique = """The answer says lumen-l3 reports max_concurrent_hw_video_decoders 4 and that ThumbGrid fails at
position 4 with NO_MEMORY: max instances reached; codec_caps and the log show exactly that, including
"recycled position=0 but decoder not released". No claim contradicts the tools."""

[[example]]
case_id = "m4q067"
verdict = "PASS"
critique = """The answer's diagnosis matches the tools: ffprobe shows 3840x2160 at 60 fps and codec_caps lists only
the software c2.android.av1.decoder at 1920x1080, 30 fps. Its aside that lumen-l3's hardware AVC/HEVC
decoders list 1920x1080 at 60 fps comes from no tool call (only video/av01 was queried), but no tool
result contradicts it. Unsupported is a different failure mode; this criterion passes."""

[[example]]
case_id = "m4q087"
verdict = "PASS"
critique = """The user says the lumen-l3 "supports 16 concurrent hardware decoders", but the answer goes by
codec_caps: max_concurrent_hw_video_decoders 4, "not 16", matching the log's failure at position 4 with
max instances reached. Disagreeing with the user in favour of the tool output passes."""

[[example]]
case_id = "m4q012"
verdict = "PASS"
critique = """The user says "Both streams start at zero", but the answer reports ffprobe's start_time 0.300000
for video and 0.000000 for audio and says the offset is already in the container timing. Every claim
agrees with the tool output, not with the user."""
