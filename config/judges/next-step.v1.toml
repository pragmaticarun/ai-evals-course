# Judge for the failure mode "vague-next-step". Version 1. It sees only the question and the answer:
# whether a next step is actionable does not depend on the tool output (see the lesson on context).
name = "next-step"
version = "v1"
mode = "vague-next-step"
context = ["question", "answer"]
criterion = "The answer's Next step is a concrete action the engineer can take now."
pass = """
The Next step names a specific action: an API to call, a setting or file to change, a measurement to
take, or the specific information to send back (for example "send the device model"). It does not need
to be correct; judge only whether it is actionable."""
fail = """
The Next step is generic advice that could follow any question ("check the documentation", "try a
different device", "look into the rendering code", "contact your provider"), or it is missing."""

[[example]]
case_id = "m4q139"
verdict = "PASS"
critique = """The answer cannot diagnose yet because no clip or device was named, and its Next step asks for
"the device id and the clip file name" and names MediaCodecInfo.isHardwareAccelerated() and
getVideoCapabilities() for video/av01. Asking for named details is actionable, not a non-answer."""

[[example]]
case_id = "m4q151"
verdict = "PASS"
critique = """The Next step is a documentation decision, not code: leave HEVC Main 10 at 2160p out of the
release notes and describe lumen-l3 as supporting up to 1080p 8-bit Main HEVC. It names exactly what to
change, so it is actionable."""

[[example]]
case_id = "m4q087"
verdict = "PASS"
critique = """The Next step opens with "Don't try to use 16 slots", but goes on to limit ThumbGrid's decoder pool
to at most 4 and release the decoder when a thumbnail position is recycled: a specific limit and a
specific change."""
