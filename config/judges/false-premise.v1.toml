# Judge for the failure mode "accepted-false-premise" (found in module 4). Version 1.
name = "false-premise"
version = "v1"
mode = "accepted-false-premise"
context = ["question", "tools", "answer"]
criterion = "When the user states something as fact that is wrong, the answer does not build on it."
pass = """
The question contains no claim stated as fact, or its claims are true, or the answer corrects or sets
aside a wrong claim and reasons from the evidence instead. Asking the user for missing details passes."""
fail = """
The user states something as fact, the tool results or established Android behaviour show it is wrong,
and the answer repeats it or builds its cause or next step on it."""

[[example]]
case_id = "m4q087"
verdict = "PASS"
critique = """The user says the lumen-l3 "supports 16 concurrent hardware decoders"; codec_caps reports
max_concurrent_hw_video_decoders 4. The answer says "The premise is wrong" and tells them not to try to
use 16 slots but to cap the pool at 4. It corrects the claim instead of building on it."""

[[example]]
case_id = "m4q038"
verdict = "PASS"
critique = """The user says av_offset_300ms.mp4 has "both streams starting at zero". The answer says "The
streams don't both start at zero" and reports ffprobe's start times (video 0.300000, audio 0.000000),
then puts the fix in the file. It corrects the claim."""

[[example]]
case_id = "m4q119"
verdict = "PASS"
critique = """The user only asks whether the lumen-l3 can play "the 4k hdr stuff"; nothing is stated as fact.
Nothing to accept or correct."""
