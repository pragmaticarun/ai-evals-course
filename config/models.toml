# Model roles for the course. Every Claude call reads its model ID from here, never from code.
# Changing a model ID changes the request hash, so recorded fixtures must be re-recorded
# (EVALS_LLM_MODE=record) after you edit this file.
#
# IDs checked against https://platform.claude.com/docs/en/about-claude/models/overview on 2026-11-23.

[agent]
# The MediaDoctor agent itself: needs good reasoning and tool use.
model = "claude-sonnet-5-5"
max_tokens = 1024

[judge]
# LLM-as-judge evaluators (module 5 onward): cheaper and faster, binary pass/fail outputs.
model = "claude-haiku-5-5"
max_tokens = 512

[synth]
# Synthetic query generation (module 4). Bulk work; run it through the Message Batches API.
model = "claude-haiku-5-5"
max_tokens = 512

# Generation settings per model, filled into every request by evalkit.LLM (unless a request sets
# them itself), so they are part of each fixture's key, its stored request, and the config
# fingerprint the eval gate compares. Checked against Anthropic's model documentation on 2026-11-23:
#
# - Sonnet 5.5 and Haiku 5.5 run adaptive thinking when a request leaves `thinking` out, and thinking
#   tokens count toward max_tokens (and are billed as output). Leaving it implicit is how an agent
#   with max_tokens = 1024 starts ending turns at stop_reason "max_tokens" with no answer.
# - The course turns thinking off explicitly: Sonnet 5.5 rejects {type = "disabled"} and takes
#   {type = "between_tools"} (no extended thinking; short progress notes between tool calls come back
#   as thinking blocks); Haiku 5.5 takes {type = "disabled"} at effort high or below.
# - Effort is set explicitly because the defaults differ (Sonnet 5.5: high; Haiku 5.5: medium).
#   Medium is the starting point for multistep tool use, low for short classification-style calls.
#
# To try thinking on, set thinking = {type = "adaptive"}, raise max_tokens in the role above to leave
# room for it (several thousand tokens), and re-record: it is a new configuration (module 11).
[generation.claude-sonnet-5-5]
thinking = {type = "between_tools"}
effort = "medium"

[generation.claude-haiku-5-5]
thinking = {type = "disabled"}
effort = "low"

# Record and live modes: every request goes to this model, whatever its role above says, and to no
# other. Replay keeps using the roles above, because the committed fixtures were keyed with them.
# Calls the API with `model` swapped in, `[generation.<model>]` for THAT model applied, and refuses
# anything not in `allowed_models` before a request leaves the machine. Recordings are keyed with the
# model really called; replay them with EVALS_REPLAY_LIVE_MODEL=1.
[live]
model = "claude-haiku-4-5"
allowed_models = ["claude-haiku-4-5"]

# Haiku 4.5 thinks only when a request asks for it (with budget_tokens) and has no effort parameter,
# so there is nothing to add; an empty table records that this was decided, not forgotten.
# Checked against Anthropic's model documentation on 2026-11-23 (still served; 200K context).
[generation.claude-haiku-4-5]

# Prices in USD per million tokens, used for the cost attributes on traces (module 2 onward).
# Checked against https://platform.claude.com/docs/en/about-claude/models/overview on 2026-11-23.
# Haiku 5.5 is listed as "from" $0.10 / $0.50; we use those base prices.
# Batch API requests are 50% off and prompt-cache reads are cheaper; module 11 models those.
# Cache prices (5-minute cache writes and cache hits) checked against
# https://platform.claude.com/docs/en/build-with-claude/prompt-caching on 2026-11-23: writes are 1.25x
# the base input price; hits are 0.05x for Sonnet 5.5 and 0.1x for Haiku 5.5. Minimum cacheable
# prompt: 512 tokens for both. Haiku's prices are for prompts up to 100,000 tokens.
[pricing.claude-sonnet-5-5]
input_per_mtok = 2.00
output_per_mtok = 10.00
cache_write_per_mtok = 2.50
cache_read_per_mtok = 0.10

# Haiku 4.5 (live and record modes only): $1 / $5; cache writes 1.25x, reads 0.1x. Its minimum cacheable
# prompt is 4,096 tokens, so module 11's ~1,000-token cached prefix will not cache on it.
[pricing.claude-haiku-4-5]
input_per_mtok = 1.00
output_per_mtok = 5.00
cache_write_per_mtok = 1.25
cache_read_per_mtok = 0.10

[pricing.claude-haiku-5-5]
input_per_mtok = 0.10
output_per_mtok = 0.50
cache_write_per_mtok = 0.125
cache_read_per_mtok = 0.01
